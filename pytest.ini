[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py

# 1. Remove "-p no:asyncio" to let the plugin work
# 2. Keep other existing options
addopts = 
    -v
    --tb=short
    --disable-warnings

# Required for AnyIO (FastAPI default)
anyio_backend = asyncio

# This fixes the PytestRemovedIn9Warning globally
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    asyncio: marks tests as asyncio
    ui: Playwright E2E tests