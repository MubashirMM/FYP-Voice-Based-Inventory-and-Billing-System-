[pytest]
# Python path configuration
pythonpath = .

# Test discovery
testpaths = tests
python_files = test_*.py

# This is the "Gold Standard" fix inside the config
# It disables the problematic asyncio plugin for your E2E tests
addopts = 
    -v
    -p no:asyncio
    --tb=short
    --disable-warnings

# Required for bridging async fixtures with sync tests
anyio_backend = asyncio

# Markers for categorizing tests
markers =
    asyncio: marks tests as asyncio
    ui: Playwright E2E tests